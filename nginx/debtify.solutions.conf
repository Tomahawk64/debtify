# Nginx config for debtify.solutions
#
# Routes the frontend and backend through ONE public origin so the browser
# never needs cross-origin requests — simplest and most reliable setup.
#
# ── One-time setup on the VPS ──────────────────────────────────────────────
#   sudo cp nginx/debtify.solutions.conf /etc/nginx/sites-available/debtify.solutions.conf
#   sudo ln -s /etc/nginx/sites-available/debtify.solutions.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
#   # Then get a free TLS cert (DNS must already point here — see below):
#   sudo certbot --nginx -d debtify.solutions -d www.debtify.solutions
#
# certbot will rewrite this file to add the `listen 443 ssl` block and a
# redirect from 80 → 443 automatically; you don't need to write that part
# by hand.
#
# ── DNS ─────────────────────────────────────────────────────────────────
# In GoDaddy, change the existing "Parked" A record for debtify.solutions
# (and add one for the "www" host) to point at this VPS's public IPv4
# address, e.g.:
#   Type  Name   Data              TTL
#   A     @      <YOUR_VPS_IP>     600 seconds
#   A     www    <YOUR_VPS_IP>     600 seconds
# DNS propagation can take a few minutes to a few hours.

server {
    listen 80;
    listen [::]:80;
    server_name debtify.solutions www.debtify.solutions;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (real-time updates) — needs the Upgrade headers for websockets
    location /socket.io/ {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (everything else)
    location / {
        proxy_pass http://127.0.0.1:7861;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
